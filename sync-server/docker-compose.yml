services:
  pennywise-sync:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SYNC_DATA_DIR: /data
      SYNC_PORT: "8080"
      # Optional: set SYNC_TOKEN to a known household token instead of auto-generating.
      # SYNC_TOKEN: replace-me
    volumes:
      - ./data:/data
      - ../dashboard/dist:/app/dashboard/dist:ro
    restart: unless-stopped
